server:
  port: 8080
  tomcat:
    connection-timeout: 600000

logging:
  level:
    com.superpower: DEBUG
    org.springframework.security: DEBUG

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:postgresql://localhost:5432/productlist
    username: productlist
    password: productlist123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 60000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: superpower-test-secret-key-for-jwt-token-generation-2026
    expiration-ms: 86400000
  doc-storage-path: ./generated-docs
