services:
  postgres:
    image: postgres:16
    container_name: productlist-pg
    environment:
      POSTGRES_DB: productlist
      POSTGRES_USER: productlist
      POSTGRES_PASSWORD: productlist123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productlist"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: product-list-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productlist
      PG_PASSWORD: productlist123
    volumes:
      - ./data/dist:/usr/share/nginx/html
      - ./data/uploads:/app/uploads
      - ./data/docs:/app/generated-docs
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
